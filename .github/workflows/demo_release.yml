name: Build Demo

on:
  push:
    tags:
      - "demo-v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get demo version
        id: version
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart("demo-v")
          echo "VERSION=$Version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $VulkanVersion = "1.4.357.0"
          $Installer = "$env:TEMP\VulkanSDK-Installer.exe"

          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$VulkanVersion/windows/vulkansdk-windows-X64-$VulkanVersion.exe" -OutFile $Installer

          Start-Process -FilePath $Installer -ArgumentList "install --accept-licenses --default-answer --confirm-command" -Wait

          $SdkPath = "C:\VulkanSDK\$VulkanVersion"
          echo "VULKAN_SDK=$SdkPath" >> $env:GITHUB_ENV
          echo "$SdkPath\Bin" >> $env:GITHUB_PATH

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: >
          cmake --preset x64-release
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"

      - name: Build demo
        run: cmake --build --preset x64-release

      - name: Locate build outputs
        id: demo_files
        shell: pwsh
        run: |
          $BuildDir = (Get-ChildItem "out" -Recurse -Directory -Filter x64-release |
            Select-Object -First 1).FullName

          if (-not $BuildDir) {
            Write-Error "Could not find x64-release directory"
            exit 1
          }

          Move-Item -Path "$BuildDir\Celestial-Rays.exe" -Destination "$BuildDir\Celestial-Rays-Demo.exe"

          echo "BUILDDIR=$BuildDir" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.VERSION }}" `
            "/DBuildDir=${{ steps.demo_files.outputs.BUILDDIR }}" `
            "$env:GITHUB_WORKSPACE\installer\Celestial-Rays-Demo.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC.exe failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Update demo release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "Demo"
          files: installer/output/Celestial-Rays-Demo.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
